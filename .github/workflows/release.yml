name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install ffmpeg exiftool

      - name: Install Python package
        run: |
          pip install -e ".[dev]"

      - name: Build Swift binary
        run: |
          cd swift && swift build -c release
          mkdir -p ../bin
          cp .build/release/vco-photos ../bin/

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src/vco --cov-report=term

      - name: Run property tests
        run: |
          pytest tests/properties/ -v

  build-swift:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Universal Binary
        run: |
          cd swift
          chmod +x build_swift.sh
          ./build_swift.sh --release

      - name: Verify binary
        run: |
          file swift/bin/vco-photos
          lipo -info swift/bin/vco-photos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vco-photos-universal
          path: swift/bin/vco-photos

  release:
    needs: [test, build-swift]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download Swift binary
        uses: actions/download-artifact@v4
        with:
          name: vco-photos-universal
          path: ./artifacts

      - name: Generate changelog
        id: changelog
        run: |
          VERSION_NUMBER="${GITHUB_REF#refs/tags/v}"
          
          # Extract changelog for this version
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk '/^## \['"$VERSION_NUMBER"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md || echo "See CHANGELOG.md for details.")
          else
            CHANGELOG="See CHANGELOG.md for details."
          fi
          
          # Save changelog to file
          cat > changelog.txt << EOF
          ## Changes in ${{ steps.version.outputs.VERSION }}
          
          $CHANGELOG
          
          ## Installation
          
          \`\`\`bash
          # Clone the repository
          git clone https://github.com/eijikominami/video-compression-optimizer.git
          cd video-compression-optimizer
          
          # Download latest Swift binary
          mkdir -p bin
          curl -sL \$(curl -s https://api.github.com/repos/eijikominami/video-compression-optimizer/releases/latest | grep browser_download_url | cut -d '"' -f 4) -o bin/vco-photos
          chmod +x bin/vco-photos
          
          # Install Python package
          pip install -e .
          \`\`\`
          
          ## Prerequisites
          
          - macOS 12.0+
          - Python 3.10+
          - AWS CLI configured
          - \`brew install ffmpeg exiftool\`
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Video Compression Optimizer ${{ steps.version.outputs.VERSION }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          files: |
            artifacts/vco-photos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [test, build-swift, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify success
        if: needs.test.result == 'success' && needs.build-swift.result == 'success' && needs.release.result == 'success'
        run: |
          echo "✅ Release ${{ needs.release.outputs.version }} completed successfully!"
          echo "- Tests passed"
          echo "- Swift binary built"
          echo "- GitHub Release created"

      - name: Notify failure
        if: needs.test.result == 'failure' || needs.build-swift.result == 'failure' || needs.release.result == 'failure'
        run: |
          echo "❌ Release failed!"
          echo "- Test result: ${{ needs.test.result }}"
          echo "- Swift build result: ${{ needs.build-swift.result }}"
          echo "- Release result: ${{ needs.release.result }}"
          exit 1
